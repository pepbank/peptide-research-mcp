name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node bin/pepbank.mjs --version
      # Trusted Publishing (OIDC): no token. npm 11.5 or later is needed.
      - run: npm --version
      - run: npm publish --provenance --access public
